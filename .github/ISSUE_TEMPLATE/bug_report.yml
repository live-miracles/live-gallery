name: Bug report
description: Something in Live Gallery does not work as expected
labels: [bug]
body:
    - type: markdown
      attributes:
          value: For questions or setup help, please use [Discussions](https://github.com/live-miracles/live-gallery/discussions) instead.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you do, what did you expect, and what happened instead?
      validations:
          required: true
    - type: dropdown
      id: source
      attributes:
          label: Source type involved
          options:
              - YouTube
              - JW Player
              - VdoCipher
              - HLS / custom URL
              - Local file
              - Screen share
              - Alerts or audio meters
              - Not about a source
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: Live Gallery version
          placeholder: e.g. 1.6.3
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - macOS (Apple Silicon)
              - macOS (Intel)
              - Linux
      validations:
          required: true
    - type: textarea
      id: extra
      attributes:
          label: Screenshots or stream details
          description: A screenshot helps. Please remove private stream keys or links first.
