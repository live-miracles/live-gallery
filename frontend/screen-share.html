<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Share</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #05070a;
        color: white;
        font:
          15px system-ui,
          sans-serif;
      }

      button {
        font: inherit;
      }

      /* Until a window is shared, show the wave nightscape like the app's empty boxes. */
      body:not(.active)::before {
        position: absolute;
        inset: 0;
        background: url('images/great-wave.avif') center / cover no-repeat;
        content: '';
      }

      .start {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .start span {
        padding: 4px 12px;
        border-radius: 999px;
        background: rgb(0 0 0 / 0.6);
        color: rgb(240 236 226 / 0.6);
        font-size: 12px;
        backdrop-filter: blur(4px);
      }

      .start:hover span {
        color: #f2efe8;
      }

      video {
        width: 100%;
        height: 100%;
        cursor: pointer;
        object-fit: contain;
      }

      .active .start {
        display: none;
      }
    </style>
  </head>
  <body>
    <video autoplay></video>
    <button class="start"><span>Click to Share Window</span></button>
    <script>
      const video = document.querySelector('video');
      const startButton = document.querySelector('.start');
      const startLabel = startButton.querySelector('span');
      let activeStream = null;
      let restoredSourceId = '';
      let savedScreenShareValue = parseScreenShareValue(new URLSearchParams(window.location.search).get('value') || '');

      function parseScreenShareValue(value) {
        try {
          const parsed = JSON.parse(value);
          return {
            micDeviceId: typeof parsed.micDeviceId === 'string' ? parsed.micDeviceId : '',
            sourceId: typeof parsed.sourceId === 'string' ? parsed.sourceId : '',
            sourceName: typeof parsed.sourceName === 'string' ? parsed.sourceName : '',
            displayId: typeof parsed.displayId === 'string' ? parsed.displayId : '',
          };
        } catch {
          return {
            micDeviceId: '',
            sourceId: '',
            sourceName: '',
            displayId: '',
          };
        }
      }

      function findSavedSource(sources, saved) {
        return sources.find((source) => source.id === saved.sourceId) || null;
      }

      function serializeScreenShareValue(value) {
        return JSON.stringify({
          micDeviceId: value.micDeviceId,
          sourceId: value.sourceId,
          sourceName: value.sourceName,
          displayId: value.displayId,
        });
      }

      function syncScreenShareUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set('value', serializeScreenShareValue(savedScreenShareValue));
        window.history.replaceState(null, '', url.toString());
      }

      function stopActiveStream() {
        activeStream?.getTracks().forEach((track) => track.stop());
        activeStream = null;
      }

      function getCleanMicConstraints(deviceId) {
        return {
          deviceId: { exact: deviceId },
          autoGainControl: false,
          echoCancellation: false,
          noiseSuppression: false,
          channelCount: 2,
        };
      }

      async function getDisplayStream(sourceId) {
        const desktopVideo = {
          mandatory: {
            chromeMediaSource: 'desktop',
            chromeMediaSourceId: sourceId,
          },
        };
        return navigator.mediaDevices.getUserMedia({
          audio: false,
          video: desktopVideo,
        });
      }

      async function startShare(source) {
        try {
          const displayStream = await getDisplayStream(source.id);
          const stream = new MediaStream(displayStream.getVideoTracks());
          stopActiveStream();
          activeStream = stream;
          video.srcObject = stream;
          video.muted = true;
          video.volume = 0;
          await video.play();
          savedScreenShareValue = {
            ...savedScreenShareValue,
            sourceId: source.id,
            sourceName: '',
            displayId: '',
          };
          restoredSourceId = source.id;
          syncScreenShareUrl();
          window.liveGalleryGuest.rememberScreenShareSource(source);
          window.liveGalleryGuest.connectScreenShareAudio();
          window.dispatchEvent(new CustomEvent('live-gallery-media-ready'));
          document.body.classList.add('active');
          displayStream.getVideoTracks()[0]?.addEventListener('ended', () => {
            if (activeStream !== stream) {
              return;
            }

            activeStream = null;
            document.body.classList.remove('active');
            startLabel.textContent = 'Click to Share Window';
            window.liveGalleryGuest.notifyScreenShareEnded();
          });
        } catch (error) {
          console.error(error);
          startLabel.textContent = 'Could not start screen share. Click to try again.';
        }
      }

      async function findRestorableSource() {
        const sources = await window.liveGalleryGuest.getDesktopSources();
        return findSavedSource(sources, savedScreenShareValue);
      }

      function openPicker() {
        startLabel.textContent = 'Click to Share Window';
        window.liveGalleryGuest.openScreenSharePicker();
      }

      startButton.addEventListener('click', openPicker);

      video.addEventListener('click', () => {
        if (document.body.classList.contains('active')) {
          openPicker();
        }
      });

      window.addEventListener('live-gallery-start-screen-share', (event) => {
        startShare(event.detail).catch((error) => {
          console.error(error);
          startLabel.textContent = 'Could not start screen share. Click to try again.';
        });
      });

      window.addEventListener('live-gallery-reset-screen-share', () => {
        savedScreenShareValue = {
          ...savedScreenShareValue,
          sourceId: '',
          sourceName: '',
          displayId: '',
        };
        restoredSourceId = '';
        syncScreenShareUrl();
        stopActiveStream();
        video.srcObject = null;
        document.body.classList.remove('active');
        startLabel.textContent = 'Click to Share Window';
      });

      window.addEventListener('DOMContentLoaded', () => {
        findRestorableSource()
          .then((savedSource) => {
            if (!savedSource || restoredSourceId === savedSource.id) {
              return;
            }

            restoredSourceId = savedSource.id;
            return startShare(savedSource);
          })
          .catch((error) => {
            console.error(error);
          });
      });
    </script>
  </body>
</html>
