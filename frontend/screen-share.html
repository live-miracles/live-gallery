<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Share</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #05070a;
        color: white;
        font:
          15px system-ui,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .start {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color: white;
        cursor: pointer;
      }

      video {
        width: 100%;
        height: 100%;
        cursor: pointer;
        object-fit: contain;
      }

      .active .start {
        display: none;
      }
    </style>
  </head>
  <body>
    <video autoplay></video>
    <button class="start">Click to Share Window</button>
    <script>
      const video = document.querySelector('video');
      const startButton = document.querySelector('.start');
      let activeStream = null;
      let restoredSourceId = '';
      let savedScreenShareValue = parseScreenShareValue(new URLSearchParams(window.location.search).get('value') || '');

      function parseScreenShareValue(value) {
        try {
          const parsed = JSON.parse(value);
          return {
            micDeviceId: typeof parsed.micDeviceId === 'string' ? parsed.micDeviceId : '',
            sourceId: typeof parsed.sourceId === 'string' ? parsed.sourceId : '',
            sourceName: typeof parsed.sourceName === 'string' ? parsed.sourceName : '',
            displayId: typeof parsed.displayId === 'string' ? parsed.displayId : '',
          };
        } catch {
          return {
            micDeviceId: '',
            sourceId: '',
            sourceName: '',
            displayId: '',
          };
        }
      }

      function findSavedSource(sources, saved) {
        if (saved.sourceId) {
          const exact = sources.find((source) => source.id === saved.sourceId);
          if (exact) {
            return exact;
          }
        }

        if (saved.displayId) {
          const displayMatch = sources.find((source) => source.displayId && source.displayId === saved.displayId);
          if (displayMatch) {
            return displayMatch;
          }
        }

        if (saved.sourceName) {
          return sources.find((source) => source.name === saved.sourceName) || null;
        }

        return null;
      }

      function stopActiveStream() {
        activeStream?.getTracks().forEach((track) => track.stop());
        activeStream = null;
      }

      function getCleanMicConstraints(deviceId) {
        return {
          deviceId: { exact: deviceId },
          autoGainControl: false,
          echoCancellation: false,
          noiseSuppression: false,
          channelCount: 2,
        };
      }

      async function getDisplayStream(sourceId, includeAudio) {
        const desktopVideo = {
          mandatory: {
            chromeMediaSource: 'desktop',
            chromeMediaSourceId: sourceId,
          },
        };
        const desktopAudio = {
          mandatory: {
            chromeMediaSource: 'desktop',
            chromeMediaSourceId: sourceId,
          },
        };

        if (!includeAudio) {
          return navigator.mediaDevices.getUserMedia({
            audio: false,
            video: desktopVideo,
          });
        }

        try {
          return await navigator.mediaDevices.getUserMedia({
            audio: desktopAudio,
            video: desktopVideo,
          });
        } catch {
          return navigator.mediaDevices.getUserMedia({
            audio: false,
            video: desktopVideo,
          });
        }
      }

      async function startShare(source) {
        try {
          const deviceId = savedScreenShareValue.micDeviceId;
          const displayStream = await getDisplayStream(source.id, !deviceId);
          const stream = new MediaStream([...displayStream.getVideoTracks(), ...(!deviceId ? displayStream.getAudioTracks() : [])]);
          stopActiveStream();
          activeStream = stream;
          video.srcObject = stream;
          video.muted = true;
          video.volume = 0;
          await video.play();
          savedScreenShareValue = {
            ...savedScreenShareValue,
            sourceId: source.id,
            sourceName: source.name,
            displayId: source.displayId || '',
          };
          window.liveGalleryGuest.rememberScreenShareSource(source);
          window.liveGalleryGuest.connectScreenShareAudio();
          window.dispatchEvent(new CustomEvent('live-gallery-media-ready'));
          document.body.classList.add('active');
          displayStream.getVideoTracks()[0]?.addEventListener('ended', () => {
            if (activeStream === stream) {
              activeStream = null;
            }
            document.body.classList.remove('active');
            startButton.textContent = 'Click to Share Window';
          });
        } catch (error) {
          console.error(error);
          startButton.textContent = 'Could not start screen share. Click to try again.';
        }
      }

      async function findRestorableSource() {
        const sources = await window.liveGalleryGuest.getDesktopSources();
        return findSavedSource(sources, savedScreenShareValue);
      }

      function openPicker() {
        startButton.textContent = 'Click to Share Window';
        window.liveGalleryGuest.openScreenSharePicker();
      }

      startButton.addEventListener('click', openPicker);

      video.addEventListener('click', () => {
        if (document.body.classList.contains('active')) {
          openPicker();
        }
      });

      window.addEventListener('live-gallery-start-screen-share', (event) => {
        startShare(event.detail).catch((error) => {
          console.error(error);
          startButton.textContent = 'Could not start screen share. Click to try again.';
        });
      });

      window.addEventListener('live-gallery-reset-screen-share', () => {
        savedScreenShareValue = {
          ...savedScreenShareValue,
          sourceId: '',
          sourceName: '',
          displayId: '',
        };
        restoredSourceId = '';
        stopActiveStream();
        video.srcObject = null;
        document.body.classList.remove('active');
        startButton.textContent = 'Click to Share Window';
      });

      window.addEventListener('DOMContentLoaded', () => {
        findRestorableSource()
          .then((savedSource) => {
            if (!savedSource || restoredSourceId === savedSource.id) {
              return;
            }

            restoredSourceId = savedSource.id;
            return startShare(savedSource);
          })
          .catch((error) => {
            console.error(error);
          });
      });
    </script>
  </body>
</html>
