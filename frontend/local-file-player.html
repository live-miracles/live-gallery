<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local File Player</title>
    <style>
      body {
        margin: 0;
        background: #05070a;
        color: #d7dde8;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      video,
      audio {
        width: 100vw;
      }

      video {
        height: 100vh;
        object-fit: contain;
      }

      audio {
        max-width: min(80vw, 36rem);
      }

      .empty {
        padding: 1rem;
        text-align: center;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main id="player-root"></main>
    <script>
      const audioExtensions = new Set(['aac', 'aif', 'aiff', 'flac', 'm4a', 'mp3', 'oga', 'ogg', 'opus', 'wav', 'weba']);
      const params = new URLSearchParams(window.location.search);
      const src = params.get('value');
      const root = document.getElementById('player-root');

      if (src) {
        const extension = src.split(/[?#]/)[0].split('.').pop()?.toLowerCase();
        const media = document.createElement(audioExtensions.has(extension) ? 'audio' : 'video');
        media.controls = true;
        media.autoplay = true;
        media.src = src;
        root.append(media);
      } else {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Choose an audio or video file.';
        root.append(empty);
      }
    </script>
  </body>
</html>
