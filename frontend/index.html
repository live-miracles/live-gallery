<!doctype html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <script type="module" src="./dist/app.js"></script>
  </head>
  <body class="bg-base-100 text-base-content min-h-screen">
    <header class="app-header bg-base-200/95 border-base-300 sticky top-0 z-10 flex min-h-0 flex-wrap items-center gap-1.5 border-b px-2 py-1">
      <details id="preset-menu" class="dropdown">
        <summary class="btn btn-secondary btn-xs btn-outline min-h-0 h-6 px-2">Preset</summary>
        <div class="dropdown-content bg-base-200/60 border-base-content/20 z-100 mt-1 w-72 rounded-md border p-1 shadow-2xl backdrop-blur-md">
          <button id="new-preset" class="btn btn-ghost btn-xs w-full justify-start hover:bg-secondary hover:text-secondary-content">
            New Preset
          </button>
          <button id="export-preset" class="btn btn-ghost btn-xs w-full justify-start hover:bg-secondary hover:text-secondary-content">
            Export Preset
          </button>
          <button id="import-preset" class="btn btn-ghost btn-xs w-full justify-start hover:bg-secondary hover:text-secondary-content">
            Import Preset
          </button>
          <button id="save-preset" class="btn btn-ghost btn-xs w-full justify-start hover:bg-secondary hover:text-secondary-content">
            Save Preset
          </button>
          <div class="divider my-1"></div>
          <div id="saved-preset-list" class="grid gap-1"></div>
        </div>
      </details>
      <button id="add-box" class="btn btn-secondary btn-xs min-h-0 h-6 w-6 px-0" title="Add box" aria-label="Add box">+</button>
      <section class="flex flex-wrap items-center gap-1.5" aria-label="Gallery controls">
        <label class="label p-0">
          <span class="sr-only">Rotation boxes</span>
          <input id="rotation-boxes" class="input input-xs w-28" type="text" placeholder="e.g. 1 3 5-9" />
        </label>
        <label class="input input-xs w-20 gap-1 px-2">
          <span class="sr-only">Rotation seconds</span>
          <input id="rotation-time" class="grow min-w-0" type="number" min="1" value="5" />
          <span class="badge badge-neutral badge-xs">sec</span>
        </label>
        <label class="swap cursor-pointer">
          <input id="mute-rotation" type="checkbox" />
          <span class="swap-on badge badge-secondary h-6 px-2">Rotate audio</span>
          <span class="swap-off badge badge-outline h-6 px-2">Rotate audio</span>
        </label>
        <label class="swap cursor-pointer">
          <input id="auto-live" type="checkbox" checked />
          <span class="swap-on badge badge-secondary h-6 px-2">YouTube Live</span>
          <span class="swap-off badge badge-outline h-6 px-2">YouTube Live</span>
        </label>
        <button id="lowest-quality" class="btn btn-secondary btn-xs btn-outline min-h-0 h-6">Low Quality</button>
      </section>
      <div class="ml-auto flex flex-wrap items-center gap-1">
        <section class="border-base-300 flex h-6 overflow-hidden rounded-md border" aria-label="Zoom controls">
          <button id="zoom-out" class="btn btn-ghost btn-xs border-base-300 h-6 min-h-0 rounded-none border-0 border-r px-2" title="Zoom out">
            -
          </button>
          <button
            id="zoom-status"
            class="btn btn-ghost btn-xs border-base-300 h-6 min-h-0 w-14 rounded-none border-0 border-r px-1 font-mono"
            title="Reset zoom">
            100%
          </button>
          <button id="zoom-in" class="btn btn-ghost btn-xs h-6 min-h-0 rounded-none border-0 px-2" title="Zoom in">+</button>
        </section>
        <button
          id="toggle-fullscreen"
          class="btn btn-secondary btn-xs btn-outline min-h-0 h-6 w-6 px-0"
          title="Enter or exit fullscreen (F11)"
          aria-label="Enter or exit fullscreen">
          <svg
            aria-hidden="true"
            class="h-3.5 w-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3" />
            <path d="M16 3h3a2 2 0 0 1 2 2v3" />
            <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
            <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
          </svg>
        </button>
        <button
          id="refresh-page"
          class="btn btn-secondary btn-xs btn-outline min-h-0 h-6 w-6 px-0"
          title="Refresh page (Ctrl+R)"
          aria-label="Refresh page">
          <svg
            aria-hidden="true"
            class="h-3.5 w-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
        </button>
      </div>
    </header>

    <main class="p-1">
      <section id="gallery" class="flex flex-wrap items-start max-[760px]:justify-center" aria-label="Live boxes"></section>
    </main>

    <aside
      id="update-toast"
      class="alert border-base-300 bg-base-200 fixed bottom-3 left-3 z-50 hidden w-80 max-w-[calc(100vw-1.5rem)] flex-col items-start gap-2 shadow-lg">
      <div>
        <div class="font-semibold">Update available</div>
        <div id="update-text" class="text-base-content/70 text-sm">A new version is ready to download.</div>
      </div>
      <progress id="update-progress" class="progress progress-secondary hidden w-full" value="0" max="100"></progress>
      <div class="flex w-full justify-end gap-2">
        <button id="update-dismiss-btn" class="btn btn-xs">Later</button>
        <button id="update-download-btn" class="btn btn-secondary btn-xs">Download</button>
        <button id="update-restart-btn" class="btn btn-secondary btn-xs hidden">Restart</button>
      </div>
    </aside>

    <div id="clipboard-toast" class="toast toast-end toast-bottom z-50 hidden">
      <div class="alert alert-success py-2">
        <span id="clipboard-toast-text">Copied</span>
      </div>
    </div>

    <dialog id="preset-name-dialog" class="modal">
      <form method="dialog">
        <div class="modal-box max-w-2xl">
          <h2 id="preset-name-title" class="mb-3 text-lg font-semibold">Preset Name</h2>
          <input id="preset-name-input" class="input input-bordered w-full" type="text" required />
          <div class="modal-action">
            <button value="cancel" formnovalidate class="btn">Cancel</button>
            <button id="preset-name-save" value="default" class="btn btn-secondary">Save</button>
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
