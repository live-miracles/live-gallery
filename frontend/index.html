<!doctype html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <script type="module" src="./dist/app.js"></script>
  </head>
  <body class="bg-base-100 text-base-content min-h-screen">
    <header class="navbar bg-base-200 border-base-300 min-h-0 items-center border-b px-4 py-3">
      <div>
        <h1 class="text-xl font-semibold leading-tight">Live Gallery</h1>
        <p class="text-base-content/70 text-sm">Monitor live links, screen shares, and embedded players in one Electron workspace.</p>
      </div>
      <div class="ml-auto flex flex-wrap items-center gap-2">
        <button id="import-url" class="btn btn-secondary btn-sm btn-outline" title="Load a shared gallery URL">Import URL</button>
        <button id="copy-url" class="btn btn-secondary btn-sm btn-outline" title="Copy this gallery layout as a URL">Copy URL</button>
        <button id="add-box" class="btn btn-secondary btn-sm">Add Box</button>
      </div>
    </header>

    <main class="p-3">
      <section class="controls" aria-label="Gallery controls">
        <label class="label cursor-pointer gap-2 p-0">
          <input id="audio-levels" class="toggle toggle-secondary toggle-sm" type="checkbox" checked />
          Audio meters
        </label>
        <label class="label cursor-pointer gap-2 p-0">
          <input id="mute-rotation" class="toggle toggle-secondary toggle-sm" type="checkbox" />
          Rotate solo audio
        </label>
        <label class="label gap-2 p-0">
          Boxes
          <input id="rotation-boxes" class="input input-xs w-28" type="text" placeholder="1 2 5" />
        </label>
        <label class="label gap-2 p-0">
          Seconds
          <input id="rotation-time" class="input input-xs w-16" type="number" min="1" value="5" />
        </label>
        <label class="label cursor-pointer gap-2 p-0">
          <input id="auto-live" class="toggle toggle-secondary toggle-sm" type="checkbox" checked />
          YouTube LIVE
        </label>
        <button id="lowest-quality" class="btn btn-secondary btn-xs btn-outline">Lowest Quality</button>
      </section>

      <section id="gallery" class="gallery" aria-label="Live boxes"></section>
    </main>

    <template id="box-template">
      <article class="box">
        <div class="box-toolbar">
          <button class="drag-handle btn btn-ghost btn-xs" title="Drag">=</button>
          <span class="box-number badge badge-sm badge-neutral"></span>
          <strong class="box-title truncate text-sm"></strong>
          <span class="box-status text-base-content/60 text-xs"></span>
          <button class="expand btn btn-secondary btn-xs btn-soft" title="Expand">□</button>
          <button class="mute btn btn-xs btn-soft" title="Mute or unmute">Muted</button>
          <button class="solo btn btn-secondary btn-xs btn-soft" title="Solo this box">Solo</button>
          <button class="edit btn btn-secondary btn-xs btn-soft" title="Edit">Edit</button>
          <button class="reload btn btn-secondary btn-xs btn-soft" title="Reload">Reload</button>
          <button class="remove btn btn-error btn-xs btn-soft" title="Remove">×</button>
        </div>
        <form class="box-form">
          <input name="name" class="input input-xs" type="text" placeholder="Name" />
          <select name="type" class="select select-xs">
            <option value="YT">YouTube</option>
            <option value="YN">YouTube Private</option>
            <option value="JW">JW Player</option>
            <option value="VC">VdoCipher</option>
            <option value="SS">Screen Share</option>
            <option value="FB">Facebook</option>
            <option value="CU">Custom URL</option>
          </select>
          <input name="value" class="input input-xs" type="text" placeholder="URL, ID, or microphone device" />
          <button type="submit" class="btn btn-secondary btn-xs">Save</button>
          <button type="button" class="cancel btn btn-xs">Cancel</button>
        </form>
        <div class="viewport">
          <webview class="player" allowpopups></webview>
          <canvas class="meter" width="40" height="180"></canvas>
          <div class="empty-state">Configure this box to load a live source.</div>
        </div>
      </article>
    </template>

    <dialog id="url-dialog" class="modal">
      <form method="dialog">
        <div class="modal-box max-w-3xl">
          <h2 class="mb-3 text-lg font-semibold">Import Gallery URL</h2>
          <input id="shared-url" class="input input-bordered w-full" type="text" placeholder="Paste gallery URL or copied sheet rows" />
          <div class="modal-action">
            <button value="cancel" class="btn">Cancel</button>
            <button id="load-shared-url" value="default" class="btn btn-secondary">Load</button>
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
