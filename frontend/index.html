<!doctype html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <script type="module" src="./dist/app.js"></script>
  </head>
  <body class="bg-base-100 text-base-content min-h-screen">
    <header class="bg-base-200/95 border-base-300 sticky top-0 z-10 flex min-h-0 flex-wrap items-center gap-1.5 border-b px-2 py-1">
      <section class="border-base-300 flex h-6 overflow-hidden rounded-md border" aria-label="Zoom controls">
        <button id="zoom-out" class="btn btn-ghost btn-xs border-base-300 h-6 min-h-0 rounded-none border-0 border-r px-2" title="Zoom out">-</button>
        <button id="zoom-status" class="btn btn-ghost btn-xs border-base-300 h-6 min-h-0 w-14 rounded-none border-0 border-r px-1 font-mono" title="Reset zoom">
          100%
        </button>
        <button id="zoom-in" class="btn btn-ghost btn-xs h-6 min-h-0 rounded-none border-0 px-2" title="Zoom in">+</button>
      </section>
      <section class="flex flex-wrap items-center gap-1.5" aria-label="Gallery controls">
        <label class="label p-0">
          <span class="sr-only">Rotation boxes</span>
          <input id="rotation-boxes" class="input input-xs w-28" type="text" placeholder="e.g. 1 3 5-9" />
        </label>
        <label class="input input-xs w-20 gap-1 px-2">
          <span class="sr-only">Rotation seconds</span>
          <input id="rotation-time" class="grow min-w-0" type="number" min="1" value="5" />
          <span class="badge badge-neutral badge-xs">sec</span>
        </label>
        <label class="swap cursor-pointer">
          <input id="mute-rotation" type="checkbox" />
          <span class="swap-on badge badge-secondary h-6 px-2">Rotate audio</span>
          <span class="swap-off badge badge-outline h-6 px-2">Rotate audio</span>
        </label>
        <label class="swap cursor-pointer">
          <input id="auto-live" type="checkbox" checked />
          <span class="swap-on badge badge-secondary h-6 px-2">YouTube Live</span>
          <span class="swap-off badge badge-outline h-6 px-2">YouTube Live</span>
        </label>
        <button id="lowest-quality" class="btn btn-secondary btn-xs btn-outline min-h-0 h-6">Lowest Quality</button>
      </section>
      <div class="ml-auto flex flex-wrap items-center gap-1">
        <button id="import-url" class="btn btn-secondary btn-xs btn-outline min-h-0 h-6 px-2" title="Load a shared gallery URL">Import URL</button>
        <button id="copy-url" class="btn btn-secondary btn-xs btn-outline min-h-0 h-6 px-2" title="Copy this gallery layout as a URL">
          Copy URL
        </button>
        <button id="add-box" class="btn btn-secondary btn-xs min-h-0 h-6 px-2">Add Box</button>
      </div>
    </header>

    <main class="p-1">
      <section id="gallery" class="flex flex-wrap items-start max-[760px]:justify-center" aria-label="Live boxes"></section>
    </main>

    <dialog id="url-dialog" class="modal">
      <form method="dialog">
        <div class="modal-box max-w-3xl">
          <h2 class="mb-3 text-lg font-semibold">Import Gallery URL</h2>
          <input id="shared-url" class="input input-bordered w-full" type="text" placeholder="Paste gallery URL or copied sheet rows" />
          <div class="modal-action">
            <button value="cancel" class="btn">Cancel</button>
            <button id="load-shared-url" value="default" class="btn btn-secondary">Load</button>
          </div>
        </div>
      </form>
    </dialog>
  </body>
</html>
